<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Bear - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd700;
            font-size: 28px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        /* Admin Panel Styles */
        .admin-container {
            display: none;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .admin-header h1 {
            color: #ffd700;
            font-size: 24px;
        }

        .logout-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #ff6b6b;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #ff5252;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-card h3 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .search-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-section h2 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-bar button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-bar button:hover {
            transform: translateY(-2px);
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .users-table th,
        .users-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .users-table th {
            color: #ffd700;
            font-weight: 600;
        }

        .users-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .users-table .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
            transition: transform 0.2s;
        }

        .users-table .action-btn:hover {
            transform: translateY(-1px);
        }

        .btn-view {
            background: #4CAF50;
            color: #fff;
        }

        .btn-reset {
            background: #ff9800;
            color: #fff;
        }

        .btn-delete {
            background: #f44336;
            color: #fff;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #ffd700;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
        }

        .user-details {
            margin-bottom: 20px;
        }

        .user-details p {
            margin: 8px 0;
            color: rgba(255, 255, 255, 0.9);
        }

        .user-details strong {
            color: #ffd700;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .action-buttons button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s, opacity 0.2s;
        }

        .action-buttons button:hover {
            transform: translateY(-2px);
        }

        .action-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-coins {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
        }

        .btn-highscores {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: #fff;
        }

        .btn-purchases {
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: #fff;
        }

        .btn-achievements {
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            color: #fff;
        }

        .btn-full-reset {
            background: linear-gradient(135deg, #ff5722, #e64a19);
            color: #fff;
        }

        .btn-delete-user {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: #fff;
        }

        .coins-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .coins-input input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
        }

        .coins-input button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: #fff;
            cursor: pointer;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status-message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            display: block;
        }

        .status-message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            display: block;
        }

        .lists-section {
            margin-top: 20px;
        }

        .lists-section h4 {
            color: #ffd700;
            margin: 15px 0 10px;
            font-size: 14px;
        }

        .item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .item-tag {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        .no-results {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 40px;
        }

        /* Recent Lists */
        .recent-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .recent-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .recent-card h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .recent-list {
            list-style: none;
        }

        .recent-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .recent-list li:last-child {
            border-bottom: none;
        }

        .recent-list .score {
            color: #ffd700;
            font-weight: bold;
        }

        .recent-list .date {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .search-bar {
                flex-direction: column;
            }

            .users-table {
                font-size: 12px;
            }

            .users-table .action-btn {
                padding: 4px 8px;
                font-size: 10px;
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>Admin Panel</h1>
            <input type="password" id="adminPassword" placeholder="Admin-Passwort eingeben" autocomplete="off">
            <button onclick="verifyAdmin()">Anmelden</button>
            <p class="error-message" id="loginError">Falsches Passwort</p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <h1>Little Bear - Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">Abmelden</button>
        </div>

        <!-- Statistics -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3 id="statUsers">-</h3>
                <p>Benutzer</p>
            </div>
            <div class="stat-card">
                <h3 id="statHighscores">-</h3>
                <p>Highscores</p>
            </div>
            <div class="stat-card">
                <h3 id="statCoins">-</h3>
                <p>Gesamte Coins</p>
            </div>
        </div>

        <!-- User Search -->
        <div class="search-section">
            <h2>Benutzer suchen</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Benutzername oder E-Mail eingeben..." onkeypress="if(event.key==='Enter')searchUsers()">
                <button onclick="searchUsers()">Suchen</button>
            </div>
            <table class="users-table" id="usersTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Benutzer</th>
                        <th>E-Mail</th>
                        <th>Coins</th>
                        <th>Highscores</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
            </table>
            <p class="no-results" id="noResults" style="display: none;">Keine Benutzer gefunden</p>
        </div>

        <!-- Recent Lists -->
        <div class="recent-section">
            <div class="recent-card">
                <h3>Top 10 Spieler</h3>
                <ul class="recent-list" id="topPlayersList"></ul>
            </div>
            <div class="recent-card">
                <h3>Neue Benutzer</h3>
                <ul class="recent-list" id="recentUsersList"></ul>
            </div>
        </div>
    </div>

    <!-- User Details Modal -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalUsername">Benutzer Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="user-details" id="userDetails"></div>
            <div class="coins-input">
                <input type="number" id="newCoinsAmount" placeholder="Neue Coin-Anzahl">
                <button onclick="setUserCoins()">Coins setzen</button>
            </div>
            <div class="action-buttons">
                <button class="btn-coins" onclick="resetUserCoins()">Coins auf 0</button>
                <button class="btn-highscores" onclick="deleteUserHighscores()">Highscores loeschen</button>
                <button class="btn-purchases" onclick="resetUserPurchases()">Kaeufe zuruecksetzen</button>
                <button class="btn-achievements" onclick="resetUserAchievements()">Achievements loeschen</button>
                <button class="btn-full-reset" onclick="fullUserReset()">Komplett-Reset</button>
                <button class="btn-delete-user" onclick="deleteUser()">Benutzer loeschen</button>
            </div>
            <div class="status-message" id="statusMessage"></div>
            <div class="lists-section" id="listsSection"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/admin';
        let isAuthenticated = false;
        let currentUserId = null;

        // Check if already authenticated (session storage)
        if (sessionStorage.getItem('adminAuth') === 'true') {
            showAdminPanel();
        }

        async function verifyAdmin() {
            const password = document.getElementById('adminPassword').value;
            const errorEl = document.getElementById('loginError');

            try {
                const response = await fetch(`${API_BASE}/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('adminAuth', 'true');
                    showAdminPanel();
                } else {
                    errorEl.style.display = 'block';
                    setTimeout(() => errorEl.style.display = 'none', 3000);
                }
            } catch (error) {
                console.error('Verification error:', error);
                errorEl.textContent = 'Verbindungsfehler';
                errorEl.style.display = 'block';
            }
        }

        function showAdminPanel() {
            isAuthenticated = true;
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
            loadStats();
        }

        function logout() {
            sessionStorage.removeItem('adminAuth');
            isAuthenticated = false;
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('adminContainer').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();

                document.getElementById('statUsers').textContent = data.userCount.toLocaleString();
                document.getElementById('statHighscores').textContent = data.highscoreCount.toLocaleString();
                document.getElementById('statCoins').textContent = data.totalCoins.toLocaleString();

                // Top Players
                const topList = document.getElementById('topPlayersList');
                topList.innerHTML = data.topPlayers.map(p =>
                    `<li><span>${escapeHtml(p.username)}</span><span class="score">${p.best_score.toLocaleString()}</span></li>`
                ).join('');

                // Recent Users
                const recentList = document.getElementById('recentUsersList');
                recentList.innerHTML = data.recentUsers.map(u =>
                    `<li><span>${escapeHtml(u.username)}</span><span class="date">${new Date(u.created_at).toLocaleDateString('de-DE')}</span></li>`
                ).join('');
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function searchUsers() {
            const query = document.getElementById('searchInput').value.trim();
            const table = document.getElementById('usersTable');
            const tbody = document.getElementById('usersTableBody');
            const noResults = document.getElementById('noResults');

            try {
                const response = await fetch(`${API_BASE}/users/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.users && data.users.length > 0) {
                    table.style.display = 'table';
                    noResults.style.display = 'none';
                    tbody.innerHTML = data.users.map(user => `
                        <tr>
                            <td>${escapeHtml(user.username)}</td>
                            <td>${escapeHtml(user.email)}</td>
                            <td>${user.total_coins.toLocaleString()}</td>
                            <td>${user.highscore_count} (Best: ${user.best_score ? user.best_score.toLocaleString() : 0})</td>
                            <td>
                                <button class="action-btn btn-view" onclick="viewUser(${user.id})">Details</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    table.style.display = 'none';
                    noResults.style.display = 'block';
                }
            } catch (error) {
                console.error('Search error:', error);
            }
        }

        async function viewUser(userId) {
            currentUserId = userId;
            const modal = document.getElementById('userModal');
            const details = document.getElementById('userDetails');
            const lists = document.getElementById('listsSection');

            try {
                const response = await fetch(`${API_BASE}/users/${userId}`);
                const data = await response.json();
                const user = data.user;

                document.getElementById('modalUsername').textContent = user.username;

                details.innerHTML = `
                    <p><strong>ID:</strong> ${user.id}</p>
                    <p><strong>E-Mail:</strong> ${escapeHtml(user.email)}</p>
                    <p><strong>Coins:</strong> ${user.total_coins.toLocaleString()}</p>
                    <p><strong>Erstellt:</strong> ${new Date(user.created_at).toLocaleString('de-DE')}</p>
                    <p><strong>Letzter Login:</strong> ${user.last_login ? new Date(user.last_login).toLocaleString('de-DE') : 'Nie'}</p>
                    <p><strong>Aktiver Skin:</strong> ${user.selected_skin || 'default'}</p>
                    <p><strong>Accessoires:</strong> Hut: ${user.selected_hat || '-'}, Brille: ${user.selected_glasses || '-'}, Cape: ${user.selected_cape || '-'}</p>
                `;

                lists.innerHTML = `
                    <h4>Gekaufte Skins (${user.purchased_skins?.length || 0})</h4>
                    <div class="item-list">
                        ${(user.purchased_skins || []).map(s => `<span class="item-tag">${s}</span>`).join('') || '<span style="color: rgba(255,255,255,0.5)">Keine</span>'}
                    </div>
                    <h4>Gekaufte Upgrades (${user.purchased_upgrades?.length || 0})</h4>
                    <div class="item-list">
                        ${(user.purchased_upgrades || []).map(u => `<span class="item-tag">${u}</span>`).join('') || '<span style="color: rgba(255,255,255,0.5)">Keine</span>'}
                    </div>
                    <h4>Gekaufte Accessoires (${user.purchased_accessories?.length || 0})</h4>
                    <div class="item-list">
                        ${(user.purchased_accessories || []).map(a => `<span class="item-tag">${a}</span>`).join('') || '<span style="color: rgba(255,255,255,0.5)">Keine</span>'}
                    </div>
                    <h4>Highscores (${data.highscores?.length || 0})</h4>
                    <div class="item-list">
                        ${(data.highscores || []).slice(0, 5).map(h => `<span class="item-tag">${h.score.toLocaleString()}</span>`).join('') || '<span style="color: rgba(255,255,255,0.5)">Keine</span>'}
                    </div>
                    <h4>Achievements (${data.achievements?.length || 0})</h4>
                    <div class="item-list">
                        ${(data.achievements || []).map(a => `<span class="item-tag">${a.achievement_id}</span>`).join('') || '<span style="color: rgba(255,255,255,0.5)">Keine</span>'}
                    </div>
                `;

                modal.style.display = 'flex';
                clearStatus();
            } catch (error) {
                console.error('Failed to load user:', error);
            }
        }

        function closeModal() {
            document.getElementById('userModal').style.display = 'none';
            currentUserId = null;
            clearStatus();
        }

        function showStatus(message, isError = false) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = 'status-message ' + (isError ? 'error' : 'success');
        }

        function clearStatus() {
            const el = document.getElementById('statusMessage');
            el.className = 'status-message';
            el.textContent = '';
        }

        async function setUserCoins() {
            const amount = parseInt(document.getElementById('newCoinsAmount').value);
            if (isNaN(amount) || amount < 0) {
                showStatus('Bitte gueltige Zahl eingeben', true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/users/${currentUserId}/coins`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount })
                });
                const data = await response.json();
                if (data.success) {
                    showStatus(data.message);
                    viewUser(currentUserId);
                    loadStats();
                } else {
                    showStatus(data.error, true);
                }
            } catch (error) {
                showStatus('Fehler beim Setzen der Coins', true);
            }
        }

        async function resetUserCoins() {
            if (!confirm('Coins auf 0 setzen?')) return;

            try {
                const response = await fetch(`${API_BASE}/users/${currentUserId}/reset-coins`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newAmount: 0 })
                });
                const data = await response.json();
                if (data.success) {
                    showStatus(data.message);
                    viewUser(currentUserId);
                    loadStats();
                } else {
                    showStatus(data.error, true);
                }
            } catch (error) {
                showStatus('Fehler beim Zuruecksetzen', true);
            }
        }

        async function deleteUserHighscores() {
            if (!confirm('Alle Highscores dieses Benutzers loeschen?')) return;

            try {
                const response = await fetch(`${API_BASE}/users/${currentUserId}/highscores`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    showStatus(data.message);
                    viewUser(currentUserId);
                    loadStats();
                } else {
                    showStatus(data.error, true);
                }
            } catch (error) {
                showStatus('Fehler beim Loeschen', true);
            }
        }

        async function resetUserPurchases() {
            if (!confirm('Alle Kaeufe (Skins, Upgrades, Accessoires) zuruecksetzen?')) return;

            try {
                const response = await fetch(`${API_BASE}/users/${currentUserId}/reset-purchases`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resetSkins: true, resetUpgrades: true, resetAccessories: true })
                });
                const data = await response.json();
                if (data.success) {
                    showStatus(data.message);
                    viewUser(currentUserId);
                } else {
                    showStatus(data.error, true);
                }
            } catch (error) {
                showStatus('Fehler beim Zuruecksetzen', true);
            }
        }

        async function resetUserAchievements() {
            if (!confirm('Alle Achievements loeschen?')) return;

            try {
                const response = await fetch(`${API_BASE}/users/${currentUserId}/achievements`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    showStatus(data.message);
                    viewUser(currentUserId);
                } else {
                    showStatus(data.error, true);
                }
            } catch (error) {
                showStatus('Fehler beim Loeschen', true);
            }
        }

        async function fullUserReset() {
            if (!confirm('WARNUNG: Kompletter Reset! Alle Daten (Coins, Highscores, Kaeufe, Achievements, Freunde) werden geloescht. Fortfahren?')) return;

            try {
                const response = await fetch(`${API_BASE}/users/${currentUserId}/full-reset`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showStatus(data.message);
                    viewUser(currentUserId);
                    loadStats();
                } else {
                    showStatus(data.error, true);
                }
            } catch (error) {
                showStatus('Fehler beim Reset', true);
            }
        }

        async function deleteUser() {
            if (!confirm('WARNUNG: Benutzer komplett loeschen? Diese Aktion kann nicht rueckgaengig gemacht werden!')) return;
            if (!confirm('Wirklich sicher? Der Benutzer und alle Daten werden unwiderruflich geloescht!')) return;

            try {
                const response = await fetch(`${API_BASE}/users/${currentUserId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    closeModal();
                    searchUsers();
                    loadStats();
                    alert(data.message);
                } else {
                    showStatus(data.error, true);
                }
            } catch (error) {
                showStatus('Fehler beim Loeschen', true);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal on outside click
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Enter key for login
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyAdmin();
        });
    </script>
</body>
